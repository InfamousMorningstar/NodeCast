services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-nodecast}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESSQL_PASSWORD is required}
      POSTGRES_DB: ${POSTGRESQL_DB:-nodecast}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nodecast']
      interval: 10s
      timeout: 5s
      retries: 5

  nodecast:
    image: morningstar0/nodecast:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRESQL_USER:-nodecast}:${POSTGRESQL_PASSWORD}@postgresql:5432/${POSTGRESQL_DB:-nodecast}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - './uploads:/nodecast/uploads'
      - './public:/nodecast/public'
      - './themes:/nodecast/themes'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://0.0.0.0:3000/api/healthcheck']
      interval: 15s
      timeout: 2s
      retries: 2

volumes:
  pgdata:
