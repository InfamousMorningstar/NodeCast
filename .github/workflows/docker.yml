name: 'Build NodeCast Docker Image'

on:
  push:
    branches: [trunk, main]
  workflow_dispatch:

jobs:
  build-only:
    name: build-test
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: nodecast:test
          build-args: |
            NODECAST_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build completed successfully
        run: |
          echo "✅ Docker build completed successfully!"
          echo "🏗️  Image built but not pushed (use local build method)"
          echo "📋 Next steps:"
          echo "   1. Use the local build script on TrueNAS Scale"
          echo "   2. Or configure container registry authentication"
