version: '3.8'

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:16
    container_name: nodecast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodecast_secure_password}
      POSTGRES_DB: nodecast
    volumes:
      # TrueNAS mount: Database storage on SSD pool
      - /mnt/app-pool/nodecast/postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nodecast']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nodecast-network

  # NodeCast Application - LOCAL BUILD
  nodecast:
    image: nodecast:local  # Built locally on TrueNAS Scale
    container_name: nodecast-app
    restart: unless-stopped
    user: "568:568"  # Run as standard container user
    ports:
      - "3000:3000"    # Web interface
      - "8081:8081"    # WebSocket sync engine
    environment:
      # Core Configuration
      NODE_ENV: production
      CORE_PORT: 3000
      CORE_HOSTNAME: 0.0.0.0
      CORE_SECRET: ${CORE_SECRET:-your-super-secret-key-change-this}
      
      # Database Configuration
      DATABASE_URL: postgres://nodecast:${POSTGRES_PASSWORD:-nodecast_secure_password}@postgresql:5432/nodecast
      
      # Storage Configuration
      DATASOURCE_TYPE: local
      DATASOURCE_LOCAL_DIRECTORY: /nodecast/uploads
      
      # ZFS Configuration for TrueNAS Scale
      ZFS_DATASET_PATH: Centauri/nodecast/uploads
      ZFS_SNAPSHOT_ENABLED: true
      ZFS_COMPRESSION_ENABLED: true
      
      # File Management
      CORE_TEMP_DIRECTORY: /nodecast/temp
      CORE_DEFAULT_DOMAIN: 192.168.1.113:3000
      CORE_RETURN_HTTPS_URLS: ${HTTPS_ENABLED:-false}
      
      # Features
      FEATURES_USER_REGISTRATION: true
      FEATURES_IMAGE_COMPRESSION: true
      FEATURES_THUMBNAILS_ENABLED: true
      FEATURES_ADVANCED_FILE_MANAGEMENT: true
      FEATURES_REAL_TIME_SYNC: true
      FEATURES_ZFS_VERSIONING: true
      
      # Upload Limits
      UPLOADS_MAX_SIZE: ${MAX_UPLOAD_SIZE:-100MB}
      UPLOADS_CHUNK_SIZE: ${CHUNK_SIZE:-8MB}
      CHUNKS_ENABLED: true
      
      # Performance
      THUMBNAILS_MAX_WORKERS: 4
      SYNC_ENGINE_PORT: 8081
      
      # Website Branding
      WEBSITE_TITLE: "NodeCast - High-Performance File Server"
      
    volumes:
      # CRITICAL: TrueNAS ZFS Dataset Mounts - Customized for your system
      - /mnt/Centauri/nodecast/uploads:/nodecast/uploads
      - /mnt/Centauri/nodecast/temp:/nodecast/temp
      - /mnt/Centauri/nodecast/public:/nodecast/public
      - /mnt/app-pool/nodecast/themes:/nodecast/themes
      - /mnt/app-pool/nodecast/config:/nodecast/config
      
      # ZFS Management (requires privileged mode for ZFS operations)
      - /sbin/zfs:/sbin/zfs:ro
      - /proc:/proc:ro
      
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nodecast-network
    # Required for ZFS operations on TrueNAS Scale
    privileged: true
    devices:
      - /dev/zfs:/dev/zfs

  # Redis for caching and session management (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: nodecast-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /mnt/app-pool/nodecast/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - nodecast-network

networks:
  nodecast-network:
    driver: bridge
    name: nodecast-network

# Optional: Health check and monitoring
volumes:
  nodecast-logs:
    name: nodecast-logs