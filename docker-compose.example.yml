version: '3.8'

# NodeCast - Self-Hosted File Server
# Official Docker Compose deployment for TrueNAS Scale and other systems
# Image automatically built and published via GitHub Actions

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nodecast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodecast}
      POSTGRES_USER: ${POSTGRES_USER:-nodecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodecast}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nodecast

  # Redis Cache (Optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: nodecast-redis
    restart: unless-stopped
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nodecast

  # NodeCast Application
  nodecast:
    image: ghcr.io/infamousmorningstar/nodecast:latest
    container_name: nodecast-app
    restart: unless-stopped
    ports:
      - "${NODECAST_PORT:-3000}:3000"
      - "${WEBSOCKET_PORT:-8081}:8081"
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodecast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nodecast}
      
      # Core Configuration
      CORE_SECRET: ${CORE_SECRET}
      CORE_PORT: 3000
      CORE_HOSTNAME: 0.0.0.0
      NODE_ENV: production
      
      # Storage Configuration
      DATASOURCE_TYPE: local
      DATASOURCE_LOCAL_DIRECTORY: /app/uploads
      CORE_TEMP_DIRECTORY: /app/temp
      
      # Network Configuration
      CORE_DEFAULT_DOMAIN: ${DOMAIN:-localhost:3000}
      CORE_RETURN_HTTPS_URLS: ${HTTPS_ENABLED:-false}
      
      # Features
      FEATURES_USER_REGISTRATION: ${USER_REGISTRATION:-true}
      FEATURES_IMAGE_COMPRESSION: ${IMAGE_COMPRESSION:-true}
      FEATURES_THUMBNAILS_ENABLED: ${THUMBNAILS_ENABLED:-true}
      FEATURES_REAL_TIME_SYNC: ${REAL_TIME_SYNC:-true}
      
      # Upload Configuration
      UPLOADS_MAX_SIZE: ${MAX_UPLOAD_SIZE:-1GB}
      UPLOADS_CHUNK_SIZE: ${CHUNK_SIZE:-16MB}
      CHUNKS_ENABLED: ${CHUNKS_ENABLED:-true}
      CHUNKS_MAX: ${CHUNKS_MAX:-5GB}
      
      # Performance
      THUMBNAILS_MAX_WORKERS: ${THUMBNAILS_WORKERS:-4}
      
      # Redis (if enabled)
      REDIS_URL: redis://redis:6379
      
      # ZFS Integration (TrueNAS Scale)
      ZFS_ENABLED: ${ZFS_ENABLED:-false}
      ZFS_DATASET_PATH: ${ZFS_DATASET_PATH:-}
      ZFS_SNAPSHOT_ENABLED: ${ZFS_SNAPSHOTS:-false}
      
      # Branding
      WEBSITE_TITLE: ${WEBSITE_TITLE:-NodeCast}
      WEBSITE_DESCRIPTION: ${WEBSITE_DESCRIPTION:-Self-Hosted File Server}
      
      # Security
      SECURITY_RATE_LIMIT_ENABLED: ${RATE_LIMIT:-true}
      
    volumes:
      # Main file storage - customize these paths for your system
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
      - ${TEMP_PATH:-./temp}:/app/temp
      - ${PUBLIC_PATH:-./public}:/app/public
      - ${CONFIG_PATH:-./config}:/app/config
      - ${THEMES_PATH:-./themes}:/app/themes
      - ${LOGS_PATH:-./logs}:/app/logs
      
      # TrueNAS Scale ZFS Integration (uncomment if using TrueNAS)
      # - /sbin/zfs:/usr/local/bin/zfs:ro
      # - /sbin/zpool:/usr/local/bin/zpool:ro
      # - /proc:/host/proc:ro
      # - /sys:/host/sys:ro
      # - /dev/zfs:/dev/zfs
      
      # Timezone
      - /etc/localtime:/etc/localtime:ro
    
    # TrueNAS Scale ZFS permissions (uncomment if using ZFS)
    # cap_add:
    #   - SYS_ADMIN
    #   - DAC_OVERRIDE
    # devices:
    #   - /dev/zfs:/dev/zfs
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - nodecast

networks:
  nodecast:
    driver: bridge

volumes:
  postgres_data:
  redis_data: