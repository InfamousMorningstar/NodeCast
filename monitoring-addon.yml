# NodeCast Monitoring Stack Addition
# Add this to the portainer-production.yml services section for comprehensive monitoring

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: nodecast-prometheus
    hostname: nodecast-prometheus
    restart: unless-stopped
    
    ports:
      - "127.0.0.1:9090:9090"  # Localhost only for security
    
    volumes:
      - prometheus-data:/prometheus:Z
      - /mnt/app-pool/nodecast/config/prometheus:/etc/prometheus:ro
      - /etc/localtime:/etc/localtime:ro
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=prometheus"
    
    networks:
      - nodecast-internal
    
    security_opt:
      - no-new-privileges:true

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nodecast-grafana
    hostname: nodecast-grafana
    restart: unless-stopped
    
    ports:
      - "3001:3000"  # Grafana on port 3001
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_DOMAIN=${NODECAST_DOMAIN:-localhost:3001}
      - GF_SERVER_ROOT_URL=http://${NODECAST_DOMAIN:-localhost:3001}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - /mnt/app-pool/nodecast/config/grafana:/etc/grafana/provisioning:ro
      - /etc/localtime:/etc/localtime:ro
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=grafana"
    
    networks:
      - nodecast-internal
      - nodecast-external
    
    secrets:
      - grafana_password
    
    security_opt:
      - no-new-privileges:true

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nodecast-node-exporter
    hostname: nodecast-node-exporter
    restart: unless-stopped
    
    ports:
      - "127.0.0.1:9100:9100"
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/localtime:/etc/localtime:ro
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=node-exporter"
    
    networks:
      - nodecast-internal
    
    security_opt:
      - no-new-privileges:true

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: nodecast-loki
    hostname: nodecast-loki
    restart: unless-stopped
    
    ports:
      - "127.0.0.1:3100:3100"
    
    volumes:
      - loki-data:/loki:Z
      - /mnt/app-pool/nodecast/config/loki:/etc/loki:ro
      - /etc/localtime:/etc/localtime:ro
    
    command:
      - '-config.file=/etc/loki/loki.yml'
      - '-target=all'
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=loki"
    
    networks:
      - nodecast-internal
    
    security_opt:
      - no-new-privileges:true

  # Promtail - Log shipping to Loki
  promtail:
    image: grafana/promtail:latest
    container_name: nodecast-promtail
    hostname: nodecast-promtail
    restart: unless-stopped
    
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /mnt/app-pool/nodecast/logs:/nodecast/logs:ro
      - /mnt/app-pool/nodecast/config/promtail:/etc/promtail:ro
      - /etc/localtime:/etc/localtime:ro
    
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=promtail"
    
    networks:
      - nodecast-internal
    
    security_opt:
      - no-new-privileges:true

  # Alertmanager - Alert handling
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nodecast-alertmanager
    hostname: nodecast-alertmanager
    restart: unless-stopped
    
    ports:
      - "127.0.0.1:9093:9093"
    
    volumes:
      - alertmanager-data:/alertmanager:Z
      - /mnt/app-pool/nodecast/config/alertmanager:/etc/alertmanager:ro
      - /etc/localtime:/etc/localtime:ro
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=alertmanager"
    
    networks:
      - nodecast-internal
    
    security_opt:
      - no-new-privileges:true

# Additional volumes for monitoring
volumes:
  prometheus-data:
    name: nodecast-prometheus-data
  
  grafana-data:
    name: nodecast-grafana-data
  
  loki-data:
    name: nodecast-loki-data
  
  alertmanager-data:
    name: nodecast-alertmanager-data

# Additional secrets for monitoring
secrets:
  grafana_password:
    external: true
    name: nodecast_grafana_password