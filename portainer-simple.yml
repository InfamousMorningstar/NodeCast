version: '3.8'

# NodeCast Simple Portainer Stack - Build from Source
# This version builds the image locally instead of pulling from registry

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:16-alpine
    container_name: nodecast-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: nodecast
      POSTGRES_PASSWORD: nodecast123  # Change this!
      POSTGRES_DB: nodecast
    
    volumes:
      - /mnt/app-pool/nodecast/postgresql:/var/lib/postgresql/data
    
    ports:
      - "127.0.0.1:5432:5432"
    
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodecast -d nodecast || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - nodecast-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nodecast-redis
    restart: unless-stopped
    
    ports:
      - "127.0.0.1:6379:6379"
    
    volumes:
      - /mnt/app-pool/nodecast/redis:/data
    
    command: >
      redis-server
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    
    networks:
      - nodecast-network

  # NodeCast Application - Built from source
  nodecast:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: nodecast-app
    restart: unless-stopped
    
    user: "568:568"  # TrueNAS Scale user
    
    ports:
      - "3000:3000"
      - "8081:8081"
    
    environment:
      # Core Settings
      NODE_ENV: production
      CORE_PORT: 3000
      CORE_HOSTNAME: 0.0.0.0
      CORE_SECRET: your-super-secret-key-change-this-immediately
      
      # Database
      DATABASE_URL: postgresql://nodecast:nodecast123@postgresql:5432/nodecast
      
      # Storage
      DATASOURCE_TYPE: local
      DATASOURCE_LOCAL_DIRECTORY: /nodecast/uploads
      CORE_TEMP_DIRECTORY: /nodecast/temp
      
      # ZFS Integration
      ZFS_ENABLED: true
      ZFS_DATASET_PATH: Centauri/nodecast/uploads
      ZFS_SNAPSHOT_ENABLED: true
      ZFS_COMPRESSION_ENABLED: true
      
      # Features
      FEATURES_USER_REGISTRATION: true
      FEATURES_IMAGE_COMPRESSION: true
      FEATURES_THUMBNAILS_ENABLED: true
      FEATURES_REAL_TIME_SYNC: true
      
      # Upload Limits
      UPLOADS_MAX_SIZE: 1GB
      UPLOADS_CHUNK_SIZE: 16MB
      CHUNKS_ENABLED: true
      CHUNKS_MAX: 5GB
      
      # Performance
      THUMBNAILS_MAX_WORKERS: 4
      SYNC_ENGINE_PORT: 8081
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Branding
      WEBSITE_TITLE: "NodeCast - High-Performance File Server"
      WEBSITE_DESCRIPTION: "ZFS-Optimized File Sharing for TrueNAS Scale"
    
    volumes:
      # File storage (your ZFS datasets)
      - /mnt/Centauri/nodecast/uploads:/nodecast/uploads
      - /mnt/Centauri/nodecast/temp:/nodecast/temp
      - /mnt/Centauri/nodecast/public:/nodecast/public
      
      # Config and themes (SSD pool)
      - /mnt/app-pool/nodecast/themes:/nodecast/themes
      - /mnt/app-pool/nodecast/config:/nodecast/config
      - /mnt/app-pool/nodecast/logs:/nodecast/logs
      
      # ZFS tools access
      - /sbin/zfs:/usr/local/bin/zfs:ro
      - /sbin/zpool:/usr/local/bin/zpool:ro
      
      # System access for ZFS
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/localtime:/etc/localtime:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/healthcheck || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - nodecast-network
    
    # ZFS permissions
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
    
    devices:
      - /dev/zfs:/dev/zfs
    
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

# Network
networks:
  nodecast-network:
    driver: bridge
    name: nodecast-network