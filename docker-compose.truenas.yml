# NodeCast - TrueNAS Scale Optimized Docker Compose
# Optimized for ZFS storage with SLOG and cache drives
version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: nodecast-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nodecast
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nodecast123}
      - POSTGRES_DB=nodecast
    volumes:
      # Use ZFS dataset with sync=always for database integrity
      - nodecast-db:/var/lib/postgresql/data
    networks:
      - nodecast-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nodecast']
      interval: 10s
      timeout: 5s
      retries: 5
    # Optimize for ZFS with SLOG
    tmpfs:
      - /tmp
      - /var/run/postgresql
    command: |
      postgres 
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c synchronous_commit=on
      -c fsync=on
      -c full_page_writes=on

  nodecast:
    build:
      context: .
      dockerfile: Dockerfile.truenas
    container_name: nodecast-app
    ports:
      - '${NODECAST_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - DEBUG=nodecast
      - DATABASE_URL=postgresql://nodecast:${POSTGRES_PASSWORD:-nodecast123}@postgres:5432/nodecast
      - CORE_HOSTNAME=0.0.0.0
      - CORE_SECRET=${CORE_SECRET}
      - DATASOURCE_TYPE=local
      - DATASOURCE_LOCAL_DIRECTORY=/nodecast/uploads
      - CORE_TEMP_DIRECTORY=/nodecast/temp
      - WEBSITE_TITLE=NodeCast - High-Performance File Server
      - FEATURES_USER_REGISTRATION=${FEATURES_USER_REGISTRATION:-true}
      - FEATURES_IMAGE_COMPRESSION=true
      - FEATURES_THUMBNAILS_ENABLED=true
      - FEATURES_THUMBNAILS_NUM_THREADS=4
      # ZFS Optimization Settings
      - CHUNKS_ENABLED=true
      - CHUNKS_MAX=1GB
      - CHUNKS_SIZE=100MB
      - FILES_MAX_FILE_SIZE=10GB
    volumes:
      # Primary storage on ZFS dataset with cache drive acceleration
      - nodecast-uploads:/nodecast/uploads
      # Temp directory on fast storage (SLOG/cache)
      - nodecast-temp:/nodecast/temp
      # Public assets (can be on cache drive for fast access)
      - nodecast-public:/nodecast/public
      # Themes directory
      - nodecast-themes:/nodecast/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nodecast-network
    restart: unless-stopped
    # Resource limits optimized for TrueNAS Scale
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  nodecast-network:
    driver: bridge
    name: nodecast-network

volumes:
  # Database volume - should be on ZFS dataset with SLOG for sync writes
  nodecast-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pool/nodecast/database

  # Upload storage - main ZFS dataset with cache drive acceleration
  nodecast-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pool/nodecast/uploads

  # Temp directory - should be on fast storage (SLOG/cache)
  nodecast-temp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pool/nodecast/temp

  # Public assets - can benefit from cache drive
  nodecast-public:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pool/nodecast/public

  # Themes directory
  nodecast-themes:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pool/nodecast/themes